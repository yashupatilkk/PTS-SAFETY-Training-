function exportPendingReport(){
  const pending=[];
  DB.trainings.forEach(t=>(t.enrolled||[]).forEach(eid=>{
    if(!(t.completed||[]).includes(eid)){const e=DB.employees.find(x=>x.id===eid);if(e)pending.push({"Employee ID":eid,"Name":e.name,"Department":e.dept,"Training":t.name,"Date":t.date,"Status":"Pending"});}
  }));
  const ws=XLSX.utils.json_to_sheet(pending.length?pending:[{"Note":"No pending trainings"}]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Pending");
  XLSX.writeFile(wb,"pending_report.xlsx");toast("Pending report exported","success");

function exportMonthlyReport(){
  const months={};
  DB.testResults.forEach(r=>{const m=r.date?r.date.substring(0,7):"Unknown";if(!months[m])months[m]={month:m,total:0,pass:0,fail:0,scores:[]};months[m].total++;if(r.pass)months[m].pass++;else months[m].fail++;months[m].scores.push(r.score);});
  const rows=Object.values(months).sort((a,b)=>a.month.localeCompare(b.month)).map(m=>({
    "Month":m.month,"Total":m.total,"Passed":m.pass,"Failed":m.fail,"Pass Rate":m.total?Math.round(m.pass/m.total*100)+"%":"0%","Avg Score":m.scores.length?Math.round(m.scores.reduce((s,v)=>s+v,0)/m.scores.length)+"%":"0%"
  }));
  if(!rows.length){toast("No test data available","warning");return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Monthly");
  XLSX.writeFile(wb,"MEP_Monthly_"+new Date().toISOString().split("T")[0]+".xlsx");toast("Monthly report exported","success");
}
function recalcPassFail(){
  let fixed=0;
  DB.testResults.forEach(r=>{
    const trn=DB.trainings.find(t=>t.name===r.training);
    const passing=trn?.passing||70;
    const shouldPass=r.score>=passing;
    if(r.pass!==shouldPass){r.pass=shouldPass;fixed++;}
  });
  saveDB();renderReports();toast(fixed?"Recalculated: "+fixed+" records corrected":"All PASS/FAIL values are correct",fixed?"success":"info");
}
function clearAllTestResults(){
  if(!confirm("DELETE all "+DB.testResults.length+" test results and "+DB.certificates.length+" certificates? This cannot be undone!"))return;
  if(!confirm("Are you ABSOLUTELY sure? All test history and certificates will be permanently deleted."))return;
  DB.testResults=[];DB.certificates=[];
  // Also clear completed status from trainings
  DB.trainings.forEach(t=>{t.completed=[];t.completedDates={};});
  saveDB();renderReports();updateBadges();toast("All test results and certificates cleared","warning");
}

function backupData(){

function restoreData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{try{const restored=JSON.parse(e.target.result);if(restored.employees)DB.employees=restored.employees;if(restored.admins)DB.admins=restored.admins;if(restored.trainings)DB.trainings=restored.trainings;if(restored.testResults)DB.testResults=restored.testResults;if(restored.certificates)DB.certificates=restored.certificates;if(restored.videos)DB.videos=restored.videos;if(restored.sops)DB.sops=restored.sops;if(restored.notifications)DB.notifications=restored.notifications;if(restored.settings)Object.assign(DB.settings,restored.settings);saveDB();renderSettings();updateBadges();toast("Data restored successfully","success");}catch{toast("Invalid backup file","error");}};
  reader.readAsText(file);
}

/* ============================================================
   GOOGLE SHEETS SYNC — Fixed with no-cors mode
============================================================ */
function buildSyncPayload(){
  return DB.testResults.map(r=>{
    const trn=DB.trainings.find(t=>t.name===r.training);
    const cert=DB.certificates.find(c=>c.empId===r.empId&&c.training===r.training);
    return{date:r.date,empId:r.empId,empName:r.empName,dept:r.dept,training:r.training,cat:r.cat||"",score:r.score,correct:r.correct,wrong:r.wrong,total:r.total,result:r.pass?"PASS":"FAIL",certRequired:trn?(trn.cert?"Yes":"No"):"Yes",certNo:r.cert||"",completionDate:r.date};
  });
}
async function syncToGoogleSheet(){
  const url=(document.getElementById("st_sheeturl")?.value||DB.settings.sheetUrl||"").trim();
  if(!url){toast("Paste your Google Apps Script URL in Settings first","error");return;}
  DB.settings.sheetUrl=url;
  const statusEl=document.getElementById("syncStatus");
  if(statusEl)statusEl.innerHTML='<span style="color:var(--amber);">⏳ Sending data to Google Sheets…</span>';
  toast("Syncing data to Google Sheets…","info",2000);
  const payload=buildSyncPayload();
  if(!payload.length){toast("No test data to sync","warning");return;}
  try{
    // Use no-cors mode: browser sends request without CORS preflight.
    // Apps Script receives and processes data; response is opaque (unreadable) but that's OK.
    await fetch(url,{
      method:"POST",
      mode:"no-cors",
      body:JSON.stringify(payload),
      headers:{"Content-Type":"text/plain"}
    });
    // With no-cors the fetch resolves (even if response is opaque), meaning the request was sent
    if(statusEl)statusEl.innerHTML=`<span style="color:var(--green);">✅ Sync request sent for ${payload.length} records on ${new Date().toLocaleString()}. Check your Google Sheet to confirm data appeared.</span>`;
    toast(`✅ Sync sent — ${payload.length} records dispatched to Google Sheets!`,"success",4000);
    DB.notifications.unshift({id:genId("N"),msg:`Google Sheets sync: ${payload.length} training records sent.`,time:"Just now",read:false,icon:"table_chart"});
    updateBadges();
  }catch(err){
    if(statusEl)statusEl.innerHTML='<span style="color:var(--red);">❌ Sync failed — check the URL is correct and Apps Script is deployed as Web App with access "Anyone".</span>';
    toast("Sync failed. Check the Apps Script URL.","error",4000);
  }
}
async function testSheetConnection(){
  const url=(document.getElementById("st_sheeturl")?.value||DB.settings.sheetUrl||"").trim();
  if(!url){toast("Enter the Apps Script URL first","error");return;}
  const statusEl=document.getElementById("syncStatus");
  if(statusEl)statusEl.innerHTML='<span style="color:var(--amber);">⏳ Testing connection…</span>';
  try{
    await fetch(url,{method:"POST",mode:"no-cors",body:JSON.stringify([{test:true}]),headers:{"Content-Type":"text/plain"}});
    if(statusEl)statusEl.innerHTML='<span style="color:var(--green);">✅ Connection test OK! Apps Script is reachable. Run "Sync Now" to push your training data.</span>';
    toast("Connection test OK","success");
  }catch{
    if(statusEl)statusEl.innerHTML='<span style="color:var(--red);">⚠ Could not reach the URL — verify it is deployed as a Web App with access set to "Anyone".</span>';
    toast("Connection test failed","error");
  }
}

============================================================ */
let ts_filter_result="All",ts_filter_cert="All",ts_search="",ts_sort="empName";
function renderTrainStatus(){
  if(!isAdmin){document.getElementById("view-trainstatus").innerHTML="<div class='empty-state'><span class='mat-ico'>lock</span><h3>Admin Access Only</h3></div>";return;}
  const rows=[];
  DB.trainings.forEach(trn=>{
    (trn.enrolled||[]).forEach(empId=>{
      const emp=DB.employees.find(e=>e.id===empId);if(!emp)return;
      const done=(trn.completed||[]).includes(empId);
      const completedDate=(trn.completedDates||{})[empId]||"";
      const result=DB.testResults.filter(r=>r.empId===empId&&r.training===trn.name).sort((a,b)=>b.score-a.score)[0]||null;
      const cert=DB.certificates.find(c=>c.empId===empId&&c.training===trn.name)||null;
      rows.push({empId,empName:emp.name,dept:emp.dept,desig:emp.desig,trnId:trn.id,trnName:trn.name,trnCat:trn.cat,certRequired:trn.cert,passing:trn.passing,score:result?result.score:null,correct:result?result.correct:null,wrong:result?result.wrong:null,totalQ:result?result.total:null,attempts:DB.testResults.filter(r=>r.empId===empId&&r.training===trn.name).length,pass:result?result.pass:null,done,completedDate,certNo:cert?cert.num:"",certExpiry:cert?cert.expiry:""});
    });
  });
  DB.testResults.forEach(r=>{
    const alreadyIn=rows.find(x=>x.empId===r.empId&&x.trnName===r.training);
    if(alreadyIn)return;
    const emp=DB.employees.find(e=>e.id===r.empId);
    const trn=DB.trainings.find(t=>t.name===r.training);
    const cert=DB.certificates.find(c=>c.empId===r.empId&&c.training===r.training)||null;
    rows.push({empId:r.empId,empName:r.empName,dept:r.dept,desig:emp?.desig||"",trnId:trn?.id||"",trnName:r.training,trnCat:r.cat||"",certRequired:trn?trn.cert:true,passing:trn?.passing||70,score:r.score,correct:r.correct,wrong:r.wrong,totalQ:r.total,attempts:DB.testResults.filter(x=>x.empId===r.empId&&x.training===r.training).length,pass:r.pass,done:r.pass,completedDate:r.date,certNo:cert?cert.num:"",certExpiry:cert?cert.expiry:""});
  });
  let filtered=rows.filter(r=>{
    const q=ts_search.toLowerCase();
    const matchSearch=!q||r.empName.toLowerCase().includes(q)||r.empId.toLowerCase().includes(q)||r.trnName.toLowerCase().includes(q)||r.dept.toLowerCase().includes(q);
    const matchResult=ts_filter_result==="All"||(ts_filter_result==="Pass"&&r.pass===true)||(ts_filter_result==="Fail"&&r.pass===false)||(ts_filter_result==="Pending"&&r.score===null);
    const matchCert=ts_filter_cert==="All"||(ts_filter_cert==="Required"&&r.certRequired)||(ts_filter_cert==="Not Required"&&!r.certRequired);
    return matchSearch&&matchResult&&matchCert;
  });
  filtered.sort((a,b)=>{
    if(ts_sort==="empName")return a.empName.localeCompare(b.empName);
    if(ts_sort==="trnName")return a.trnName.localeCompare(b.trnName);
    if(ts_sort==="score")return(b.score||0)-(a.score||0);
    if(ts_sort==="dept")return a.dept.localeCompare(b.dept);
    if(ts_sort==="date")return(b.completedDate||"").localeCompare(a.completedDate||"");
    return 0;
  });
  const passCount=filtered.filter(r=>r.pass===true).length;
  const failCount=filtered.filter(r=>r.pass===false).length;
  const pendingCount=filtered.filter(r=>r.score===null).length;
  const certCount=filtered.filter(r=>r.certNo).length;
  document.getElementById("view-trainstatus").innerHTML=`
    <div class="section-header">
      <div class="section-title">Training Completion <span>Status</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-green" onclick="syncToGoogleSheet()"><span class="mat-ico">table_chart</span> Sync to Google Sheets</button>
        <button class="btn btn-outline" onclick="exportFullStatusReport()"><span class="mat-ico">download</span> Export Excel</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px 16px;display:flex;align-items:center;gap:8px;">
        <span class="mat-ico" style="color:var(--blue);font-size:18px;">people</span>
        <div><div style="font-size:18px;font-weight:700;">${filtered.length}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;">Total Records</div></div>
      </div>
      <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px 16px;display:flex;align-items:center;gap:8px;">
        <span class="mat-ico" style="color:var(--green);font-size:18px;">check_circle</span>
        <div><div style="font-size:18px;font-weight:700;color:var(--green);">${passCount}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;">Passed</div></div>
      </div>
      <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px 16px;display:flex;align-items:center;gap:8px;">
        <span class="mat-ico" style="color:var(--red);font-size:18px;">cancel</span>
        <div><div style="font-size:18px;font-weight:700;color:var(--red);">${failCount}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;">Failed</div></div>
      </div>
      <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px 16px;display:flex;align-items:center;gap:8px;">
        <span class="mat-ico" style="color:var(--orange);font-size:18px;">pending</span>
        <div><div style="font-size:18px;font-weight:700;color:var(--orange);">${pendingCount}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;">Pending</div></div>
      </div>
      <div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px 16px;display:flex;align-items:center;gap:8px;">
        <span class="mat-ico" style="color:var(--purple);font-size:18px;">workspace_premium</span>
        <div><div style="font-size:18px;font-weight:700;color:var(--purple);">${certCount}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;">Certificates</div></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
      <div class="search-wrap" style="flex:1;min-width:200px;max-width:340px;">
        <span class="mat-ico">search</span>
        <input class="search-bar" placeholder="Search name, ID, training, dept..." oninput="ts_search=this.value;renderTrainStatus()" value="${ts_search}">
      </div>
      <select class="form-control-sm" style="width:130px;" onchange="ts_filter_result=this.value;renderTrainStatus()">

function exportFullStatusReport(){
  const rows=[];
  DB.trainings.forEach(trn=>{
    (trn.enrolled||[]).forEach(empId=>{
      const emp=DB.employees.find(e=>e.id===empId);if(!emp)return;
      const done=(trn.completed||[]).includes(empId);
      const completedDate=(trn.completedDates||{})[empId]||"";
      const result=DB.testResults.filter(r=>r.empId===empId&&r.training===trn.name).sort((a,b)=>b.score-a.score)[0]||null;
      const cert=DB.certificates.find(c=>c.empId===empId&&c.training===trn.name)||null;
      rows.push({"Employee ID":empId,"Employee Name":emp.name,"Department":emp.dept,"Designation":emp.desig||"","Training Name":trn.name,"Category":trn.cat,"Cert Required":trn.cert?"Yes":"No","Pass Mark (%)":trn.passing||70,"Score (%)":result?result.score:"Not Taken","Correct":result?result.correct:"","Wrong":result?result.wrong:"","Total Questions":result?result.total:"","Attempts":DB.testResults.filter(r=>r.empId===empId&&r.training===trn.name).length,"Result":result?(result.pass?"PASS":"FAIL"):"Pending","Completion Date":completedDate||"","Certificate No":cert?cert.num:"","Certificate Issued":cert?cert.issued:"","Certificate Expiry":cert?cert.expiry:""});
    });
  });
  DB.testResults.forEach(r=>{
    const alreadyIn=rows.find(x=>x["Employee ID"]===r.empId&&x["Training Name"]===r.training);
    if(!alreadyIn){
      const emp=DB.employees.find(e=>e.id===r.empId);const trn=DB.trainings.find(t=>t.name===r.training);const cert=DB.certificates.find(c=>c.empId===r.empId&&c.training===r.training)||null;
      rows.push({"Employee ID":r.empId,"Employee Name":r.empName,"Department":r.dept,"Designation":emp?.desig||"","Training Name":r.training,"Category":r.cat||"","Cert Required":trn?(trn.cert?"Yes":"No"):"Yes","Pass Mark (%)":trn?.passing||70,"Score (%)":r.score,"Correct":r.correct,"Wrong":r.wrong,"Total Questions":r.total,"Attempts":DB.testResults.filter(x=>x.empId===r.empId&&x.training===r.training).length,"Result":r.pass?"PASS":"FAIL","Completion Date":r.date,"Certificate No":cert?cert.num:"","Certificate Issued":cert?cert.issued:"","Certificate Expiry":cert?cert.expiry:""});
    }
  });
  if(!rows.length){toast("No training data to export","warning");return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:22},{wch:16},{wch:20},{wch:30},{wch:18},{wch:12},{wch:12},{wch:10},{wch:8},{wch:8},{wch:14},{wch:10},{wch:10},{wch:16},{wch:20},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Training Status");
  XLSX.writeFile(wb,"MEP_Training_Status_"+new Date().toISOString().split("T")[0]+".xlsx");
  toast("Full training status exported","success");
}

/* ============================================================
   DATA PERSISTENCE — Auto-save & load all data to localStorage
============================================================ */
const DB_STORAGE_KEY="pts_safety_db";
let _syncBusy=false;
let _lastSyncTime=null;
function updateSyncUI(status){
  const icon=document.getElementById('syncIcon');
  const txt=document.getElementById('syncText');
  const wrap=document.getElementById('syncIndicator');
  if(!icon||!txt)return;
  if(status==='syncing'){
    icon.textContent='sync';icon.style.color='var(--amber)';icon.style.animation='spin 1s linear infinite';
    txt.textContent='Syncing...';txt.style.color='var(--amber)';
    wrap.style.borderColor='var(--amber)';
  }else if(status==='error'){
    icon.textContent='cloud_off';icon.style.color='var(--red)';icon.style.animation='';
    txt.textContent='Sync Failed';txt.style.color='var(--red)';
    wrap.style.borderColor='var(--red)';
    setTimeout(()=>updateSyncUI('idle'),4000);
  }else{
    icon.textContent='cloud_done';icon.style.color='var(--green)';icon.style.animation='';
    const ago=_lastSyncTime?Math.round((Date.now()-_lastSyncTime)/1000)+'s ago':'Ready';
    txt.textContent='Synced';txt.style.color='var(--muted)';
    wrap.style.borderColor='var(--bdr)';
  }
}
function saveDB(){
  try{
    const data=JSON.parse(JSON.stringify(DB));
    localStorage.setItem(DB_STORAGE_KEY,JSON.stringify(data));
  }catch(e){}
  // Firebase sync — show status, prevent double-sync
  if(firebaseReady&&!_syncBusy){
    _syncBusy=true;
    updateSyncUI('syncing');
    const syncPromise=Promise.all([
      fbSaveCollection('employees',DB.employees,'id'),
      fbSaveCollection('admins',DB.admins,'username'),
      fbSaveCollection('trainings',DB.trainings,'id'),
      fbSaveCollection('testResults',DB.testResults,'id'),
      fbSaveCollection('certificates',DB.certificates,'num'),
      fbSaveCollection('notifications',DB.notifications,'id'),
      fbSaveCollection('videos',DB.videos,'id'),
      fbSaveCollection('sops',DB.sops,'id'),
      fbSaveCollection('customEquipment',DB.customEquipment||[],'id'),
      fbSaveCollection('customQuestions',DB.customQuestions||[],'ts'),
      fbSaveSettings()
    ]);
    syncPromise.then(()=>{
      _lastSyncTime=Date.now();
      updateSyncUI('idle');
    }).catch(()=>{
      updateSyncUI('error');
    }).finally(()=>{_syncBusy=false;});
  }
}
function loadDBFromLocal(){
  try{
    const raw=localStorage.getItem(DB_STORAGE_KEY);
    if(!raw)return false;
    const saved=JSON.parse(raw);
    if(saved.employees&&Array.isArray(saved.employees)&&saved.employees.length>0)DB.employees=saved.employees;
    if(saved.trainings&&Array.isArray(saved.trainings))DB.trainings=saved.trainings;
    if(saved.testResults&&Array.isArray(saved.testResults))DB.testResults=saved.testResults;
    if(saved.certificates&&Array.isArray(saved.certificates))DB.certificates=saved.certificates;
    if(saved.videos&&Array.isArray(saved.videos))DB.videos=saved.videos;
    if(saved.sops&&Array.isArray(saved.sops))DB.sops=saved.sops;
    if(saved.notifications&&Array.isArray(saved.notifications))DB.notifications=saved.notifications;
    if(saved.settings&&typeof saved.settings==="object")Object.assign(DB.settings,saved.settings);
    if(saved.admins&&Array.isArray(saved.admins)&&saved.admins.length>0){
      DB.admins=saved.admins;
    }
    if(saved.customEquipment&&Array.isArray(saved.customEquipment))DB.customEquipment=saved.customEquipment;
    if(saved.customQuestions&&Array.isArray(saved.customQuestions)){
      saved.customQuestions.forEach(cq=>{
        if(!QUESTION_BANK[cq.cat])QUESTION_BANK[cq.cat]=[];
        // Avoid duplicates
        if(!QUESTION_BANK[cq.cat].find(q=>q.q===cq.q&&q.customFor===cq.customFor)){
          QUESTION_BANK[cq.cat].push({q:cq.q,o:cq.o,a:cq.a,customFor:cq.customFor});
        }
      });
      DB.customQuestions=saved.customQuestions;
    }
    return true;
  }catch(e){console.warn("Local load failed:",e);return false;}
}

async function loadDBFromFirestore(){
  let loaded=0;let failed=[];
  try{
    // Load each collection individually — one failure won't break the rest
    const cols=[
      ['employees','id',d=>{if(d.size>0)DB.employees=d.docs.map(x=>x.data());}],
      ['trainings','id',d=>{if(d.size>0)DB.trainings=d.docs.map(x=>x.data());}],
      ['testResults','id',d=>{if(d.size>0)DB.testResults=d.docs.map(x=>x.data());}],
      ['certificates','num',d=>{if(d.size>0)DB.certificates=d.docs.map(x=>x.data());}],
      ['videos','id',d=>{if(d.size>0)DB.videos=d.docs.map(x=>x.data());}],
      ['sops','id',d=>{if(d.size>0)DB.sops=d.docs.map(x=>x.data());}],
      ['notifications','id',d=>{if(d.size>0)DB.notifications=d.docs.map(x=>x.data());}],
      ['admins','username',d=>{if(d.size>0)DB.admins=d.docs.map(x=>x.data());}],
      ['customEquipment','id',d=>{if(d.size>0)DB.customEquipment=d.docs.map(x=>x.data());}],
      ['customQuestions','ts',d=>{if(d.size>0){DB.customQuestions=d.docs.map(x=>x.data());DB.customQuestions.forEach(cq=>{if(!QUESTION_BANK[cq.cat])QUESTION_BANK[cq.cat]=[];if(!QUESTION_BANK[cq.cat].find(q=>q.q===cq.q&&q.customFor===cq.customFor)){QUESTION_BANK[cq.cat].push({q:cq.q,o:cq.o,a:cq.a,customFor:cq.customFor});}});}}]
    ];
    const results=await Promise.allSettled(cols.map(async([name,,fn])=>{try{const snap=await fbDB.collection(name).get();fn(snap);loaded++;}catch(e){failed.push(name);console.warn('Firestore load failed for '+name+':',e);}}));
    // Load settings separately (it's a single doc, not a collection)
    try{const setSnap=await fbDB.collection('config').doc('settings').get();if(setSnap.exists)Object.assign(DB.settings,setSnap.data());loaded++;}catch(e){failed.push('config/settings');}
    console.log('Firestore loaded: '+loaded+'/'+(cols.length+1)+' collections OK'+(failed.length?' (failed: '+failed.join(', ')+')':''));
    return true; // Always return true so firebaseReady stays ON
  }catch(e){
    console.warn('Firestore load error:',e);
    return true; // Still return true — keep Firebase active for saves
  }
}

function loadDB(){
  // Synchronous: load from localStorage for immediate use
  loadDBFromLocal();
  // Always ensure defaults exist
  if(!DB.admins.find(a=>a.username==="admin")){
    DB.admins.push({username:"admin",password:"admin123",name:"Admin User",role:"admin"});
  }
  if(!DB.employees.find(e=>e.id==="EMP001")){
    DB.employees.unshift({id:"EMP001",name:"Rajesh Kumar",dept:"Electrical",desig:"Electrical Technician",shift:"Day",mobile:"9876543210",email:"rajesh@site.com",status:"active",joining:"2022-01-15",manager:"MGR001",location:"Main Building",photo:"",password:"emp123",company:"MEP Solutions"});
  }
}
async function resetDBToDefault(){
  if(!confirm("Reset ALL data to defaults? This will delete all employees, trainings, test results, and certificates you added. This cannot be undone."))return;
  localStorage.removeItem(DB_STORAGE_KEY);
  if(firebaseReady&&confirm("Also clear Firebase cloud data?")){
    try{
      const cols=['employees','admins','trainings','testResults','certificates','notifications','videos','sops','config'];
      for(const c of cols){
        const snap=await fbDB.collection(c).get();
        const batch=fbDB.batch();
        snap.docs.forEach(d=>batch.delete(d.ref));
        if(snap.size)await batch.commit();
      }
      toast('Firebase data cleared','success');
    }catch(e){toast('Firebase clear error: '+e.message,'error');}
  }
  location.reload();
}

/* Force clear stale login cache to fix credential issues */
(function(){
  try{
    const old=localStorage.getItem("mep_user");
    if(old){const p=JSON.parse(old);if(!p.type||(p.type!=="admin"&&p.type!=="employee")){localStorage.removeItem("mep_user");}}
  }catch(e){localStorage.removeItem("mep_user");}
})();

async function initApp(){
  // Show loading state
  const loginForm=document.querySelector('.login-wrap');
  const loadMsg=document.getElementById('fbLoadStatus');
  if(loadMsg)loadMsg.style.display='block';

  // 1. Load from localStorage immediately (sync)
  loadDB();

  // 2. Try Firebase/Firestore
  try{
    firebaseReady=true;
    await loadDBFromFirestore();
    // Always keep firebaseReady ON — even partial load is OK
    if(!DB.admins.find(a=>a.username==="admin")){
      DB.admins.push({username:"admin",password:"admin123",name:"Admin User",role:"admin"});
    }
    if(!DB.employees.find(e=>e.id==="EMP001")){
      DB.employees.unshift({id:"EMP001",name:"Rajesh Kumar",dept:"Electrical",desig:"Electrical Technician",shift:"Day",mobile:"9876543210",email:"rajesh@site.com",status:"active",joining:"2022-01-15",manager:"MGR001",location:"Main Building",photo:"",password:"emp123",company:"MEP Solutions"});
    }
    saveDB();
    await seedFirestore();
  }catch(e){
    console.warn('Firebase init error:',e);
    // Do NOT set firebaseReady=false — keep trying to save
  }

  if(loadMsg)loadMsg.style.display='none';

  // Double-check: guarantee default admin always present
  if(!DB.admins.find(a=>a.username==="admin")){
    DB.admins.push({username:"admin",password:"admin123",name:"Admin User",role:"admin"});
    saveDB();
  }
  const t=localStorage.getItem("mep_theme")||"dark";
  document.documentElement.setAttribute("data-theme",t);
  DB.settings.theme=t;
  document.getElementById("themeBtn").querySelector(".mat-ico").textContent=t==="dark"?"dark_mode":"light_mode";

  // Try Firebase Auth persistence first
  try{
    if(firebaseReady){
      await new Promise(r=>{const unsub=fbAuth.onAuthStateChanged(r);setTimeout(unsub,3000);});
      const fbUser=fbAuth.currentUser;
      if(fbUser){
        const uid=fbUser.email.split('@')[0].toUpperCase();
        let found=false;
        if(uid==='ADMIN'){
          const admin=DB.admins.find(a=>a.username==='admin');
          if(admin){currentUser={...admin,type:"admin"};isAdmin=true;found=true;}
        }else{
          const emp=DB.employees.find(e=>e.id===uid);
          if(emp){currentUser={...emp,type:"employee"};isAdmin=false;found=true;}
        }
        if(found){startApp();return;}
      }
    }
  }catch(e){console.warn('Auth persistence check error:',e);}

  // Fallback: check localStorage session
  const saved=localStorage.getItem("mep_user");
  if(saved){
    try{
      const parsed=JSON.parse(saved);
      let valid=false;
      if(parsed.type==="admin"){
        const match=DB.admins.find(a=>a.username===parsed.username);
        if(match){currentUser={...match,type:"admin"};isAdmin=true;valid=true;}
      }else if(parsed.type==="employee"){
        const match=DB.employees.find(e=>e.id===parsed.id);
        if(match){currentUser={...match,type:"employee"};isAdmin=false;valid=true;}
      }
      if(valid){startApp();}else{localStorage.removeItem("mep_user");}
    }catch{localStorage.removeItem("mep_user");}
  }
}

initApp();
