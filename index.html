<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTS SAFETY — Training Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
:root{--amber:#ffb020;--amber-d:#e0961a;--amber-light:rgba(255,176,32,.12);--red:#e8483a;--green:#3ecf8e;--orange:#f0883e;--purple:#8b6de8;--blue:#3ea0e8;--r:12px;--r-sm:8px;--r-lg:18px;--sidebar-w:260px;--stripe:repeating-linear-gradient(45deg,#151515 0 14px,var(--amber) 14px 28px);--trans:.2s ease;}
html[data-theme="dark"]{--bg:#0d1117;--bg2:#090b0e;--sur:#161b22;--sur2:#1c2333;--sur3:#22293a;--sur4:#2a3347;--txt:#e6edf3;--txt2:#c9d1d9;--muted:#7d8590;--bdr:#2d333b;--bdr2:#3d444d;--shadow:0 8px 32px rgba(0,0,0,.55);--card-hover:0 0 0 1px var(--amber),0 12px 40px rgba(255,176,32,.08);--glass:rgba(22,27,34,.85);}
html[data-theme="light"]{--bg:#f0f2f5;--bg2:#e8eaed;--sur:#fff;--sur2:#f6f8fa;--sur3:#eaeef2;--sur4:#dde3ea;--txt:#1f2328;--txt2:#3d444d;--muted:#656d76;--bdr:#d0d7de;--bdr2:#c4cdd5;--shadow:0 8px 32px rgba(20,20,10,.1);--card-hover:0 0 0 1px var(--amber),0 12px 40px rgba(255,176,32,.1);--glass:rgba(255,255,255,.92);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;transition:background .3s,color .3s;}
h1,h2,h3,h4,.disp{font-family:'Oswald',sans-serif;letter-spacing:.02em;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;outline:none;color:var(--txt);background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;transition:border var(--trans);}
input:focus,select:focus,textarea:focus{border-color:var(--amber);}
select option{background:var(--sur);}
::selection{background:var(--amber);color:#151515;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
.mono{font-family:'JetBrains Mono',monospace;}
.mat-ico{font-family:'Material Icons Round';font-size:inherit;font-style:normal;line-height:1;vertical-align:middle;}
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-dots{background-image:radial-gradient(circle at 1px 1px,var(--bdr) .5px,transparent 0);background-size:28px 28px;opacity:.25;}
.bg-glow{background:radial-gradient(ellipse at 10% 20%,rgba(255,176,32,.04) 0%,transparent 50%),radial-gradient(ellipse at 90% 80%,rgba(62,207,142,.03) 0%,transparent 50%);}
.gradient-bar{height:3px;background:linear-gradient(90deg,var(--amber),var(--red),var(--amber),var(--green),var(--amber));background-size:300% 100%;animation:grS 4s linear infinite;position:relative;z-index:70;}
@keyframes grS{to{background-position:300% 50%;}}
/* LOGIN - SAFETY THEMED */
#loginPage{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#0a0c10;overflow:auto;}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(232,72,58,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,176,32,.05) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(62,207,142,.03) 0%,transparent 60%);pointer-events:none;}
.login-dots{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,176,32,.15) .5px,transparent 0);background-size:40px 40px;opacity:.3;pointer-events:none;}
.login-safety-bar{position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,#e8483a 0 30px,#ffb020 30px 60px,#3ecf8e 60px 90px);animation:safetyBarSlide 4s linear infinite;}
@keyframes safetyBarSlide{to{background-position:90px 0;}}
.login-safety-icons{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.login-safety-icons::before,.login-safety-icons::after{content:'';position:absolute;border-radius:50%;}
.login-safety-icons::before{top:10%;right:8%;width:180px;height:180px;border:2px dashed rgba(232,72,58,.12);animation:safetySpin 30s linear infinite;}
.login-safety-icons::after{bottom:15%;left:5%;width:120px;height:120px;border:2px dashed rgba(255,176,32,.1);animation:safetySpin 25s linear infinite reverse;}
@keyframes safetySpin{to{transform:rotate(360deg);}}
.login-wrap{position:relative;z-index:1;width:100%;max-width:540px;padding:20px;}
.login-card{background:rgba(22,27,34,.92);backdrop-filter:blur(24px);border:1px solid rgba(232,72,58,.15);border-radius:20px;padding:40px 36px;box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 80px rgba(232,72,58,.05),inset 0 1px 0 rgba(255,255,255,.03);position:relative;overflow:hidden;}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e8483a,#ffb020,#3ecf8e);}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .logo-mark{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,#e8483a 0%,#ffb020 100%);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 32px rgba(232,72,58,.35);animation:safetyPulse 3s ease-in-out infinite;position:relative;}
.login-logo .logo-mark::after{content:'';position:absolute;inset:-4px;border-radius:20px;border:2px solid rgba(232,72,58,.2);animation:safetyRing 2s ease-in-out infinite;}
@keyframes safetyPulse{0%,100%{box-shadow:0 8px 32px rgba(232,72,58,.35);}50%{box-shadow:0 8px 48px rgba(255,176,32,.4);}}
@keyframes safetyRing{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:.5;transform:scale(1.05);}}
@keyframes strA{to{background-position:22px 22px;}}
.login-logo h1{font-size:20px;text-transform:uppercase;font-weight:700;letter-spacing:.06em;background:linear-gradient(90deg,#e8483a,#ffb020);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.login-logo p{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}
.login-tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:12px;padding:4px;margin-bottom:22px;}
.login-tab{flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);transition:all .25s ease;border:none;background:transparent;cursor:pointer;}
.login-tab.active{background:linear-gradient(135deg,#e8483a,#d43a2e);color:#fff;box-shadow:0 4px 16px rgba(232,72,58,.3);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px;}
.form-control{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bdr);background:rgba(255,255,255,.03);color:var(--txt);font-size:13.5px;transition:all .25s ease;}
.form-control:focus{border-color:#e8483a;box-shadow:0 0 0 3px rgba(232,72,58,.12);outline:none;}
.input-icon-wrap{position:relative;}
.input-icon-wrap .mat-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;}
.input-icon-wrap .form-control{padding-left:38px;}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:18px;}
.checkbox-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.checkbox-label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;}
.checkbox-label input[type=checkbox]{width:15px;height:15px;accent-color:#e8483a;}
.link-btn{font-size:12.5px;color:#e8483a;font-weight:600;background:none;border:none;cursor:pointer;}
.btn-primary-full{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#e8483a 0%,#c73a2e 100%);color:#fff;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .25s ease;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(232,72,58,.3);}
.btn-primary-full:hover{background:linear-gradient(135deg,#ff5a4a 0%,#e8483a 100%);transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,72,58,.4);}
.login-footer{text-align:center;margin-top:20px;font-size:11px;color:var(--muted);letter-spacing:.04em;}
.login-footer span{color:var(--amber);font-weight:600;}
.demo-hint{background:rgba(232,72,58,.06);border:1px solid rgba(232,72,58,.15);border-radius:10px;padding:12px 16px;margin-top:14px;font-size:11.5px;color:var(--muted);text-align:left;}
.demo-hint b{color:#e8483a;}
.demo-hint div{margin-bottom:2px;}
.demo-hint div:last-child{margin-bottom:0;}

@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(62,207,142,.4);}50%{box-shadow:0 0 0 8px rgba(62,207,142,0);}}
.pulse-glow{animation:pulseGlow 1.5s ease-in-out infinite;}
/* SIDEBAR */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:59;}
.sidebar-backdrop.show{display:block;}
#sidebar{position:fixed;top:3px;left:0;bottom:0;width:var(--sidebar-w);z-index:60;background:var(--sur);border-right:1px solid var(--bdr);display:flex;flex-direction:column;transition:transform .3s ease;}
.sidebar-head{padding:14px 14px 10px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-mark{width:36px;height:36px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--stripe);background-size:20px 20px;font-size:16px;animation:strA 3s linear infinite;}
.brand-text h2{font-size:13.5px;text-transform:uppercase;font-weight:700;line-height:1.15;}
.brand-text span{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.sidebar-nav{flex:1;overflow-y:auto;padding:6px 7px;}
.nav-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 9px 4px;opacity:.5;}
.nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--r-sm);font-size:12px;font-weight:500;transition:all .15s;position:relative;text-align:left;cursor:pointer;}
.nav-item:hover{background:var(--sur2);}
.nav-item.active{background:var(--amber-light);color:var(--amber);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--amber);}
.nav-item .mat-ico{font-size:17px;flex:none;width:22px;text-align:center;}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;background:var(--sur3);padding:2px 6px;border-radius:99px;color:var(--muted);min-width:20px;text-align:center;}
.nav-item.active .nav-badge{background:rgba(255,176,32,.15);color:var(--amber);}
.sidebar-foot{padding:10px 14px 12px;border-top:1px solid var(--bdr);flex-shrink:0;}
.user-card{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--r-sm);background:var(--sur2);border:1px solid var(--bdr);cursor:pointer;transition:all var(--trans);}
.user-card:hover{border-color:var(--amber);}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber-d));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#151515;flex:none;}
.user-name{font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-role{font-size:10px;color:var(--muted);}
.foot-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--bdr);background:var(--sur2);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all var(--trans);cursor:pointer;}
.icon-btn:hover{background:var(--amber);color:#151515;border-color:var(--amber);}
/* MAIN */
.main-area{margin-left:var(--sidebar-w);height:calc(100vh - 3px);display:flex;flex-direction:column;position:relative;z-index:1;}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--bdr);background:var(--glass);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40;}
.menu-toggle{display:none;width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--bdr);background:var(--sur2);font-size:16px;align-items:center;justify-content:center;flex:none;cursor:pointer;}
.page-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;text-transform:uppercase;flex:none;}
.topbar-gap{flex:1;}
.topbar-search{position:relative;flex:none;}
.topbar-search input{width:220px;padding:7px 12px 7px 34px;border-radius:99px;font-size:12px;color:var(--txt);border:1px solid var(--bdr);background:var(--sur2);transition:width .2s;}
.topbar-search input:focus{border-color:var(--amber);width:280px;}
.topbar-search .mat-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;}
.topbar-actions{display:flex;align-items:center;gap:6px;}
.notif-btn{position:relative;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--bdr);background:var(--sur2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--trans);}
.notif-btn:hover{border-color:var(--amber);background:var(--amber-light);}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--sur);}
.role-chip{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.role-chip.admin{background:rgba(255,176,32,.15);color:var(--amber);}
.role-chip.employee{background:rgba(62,207,142,.12);color:var(--green);}
.content{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth;}
.view{display:none;}
.view.active{display:block;animation:fadeUp .4s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
/* NOTIFICATION PANEL */
.notif-panel{position:fixed;top:58px;right:14px;width:340px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shadow);z-index:100;display:none;}
.notif-panel.open{display:block;animation:fadeUp .2s ease;}
.notif-head{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.notif-list{max-height:360px;overflow-y:auto;}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .15s;}
.notif-item:hover{background:var(--sur2);}
.notif-item.unread{background:var(--amber-light);}
.notif-msg{font-size:12px;line-height:1.4;}
.notif-time{font-size:10.5px;color:var(--muted);margin-top:2px;}
/* SHARED COMPONENTS */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.section-title{font-size:19px;text-transform:uppercase;font-weight:700;}
.section-title span{color:var(--amber);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;transition:all var(--trans);cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn-amber{background:var(--amber);color:#151515;border-color:var(--amber);}
.btn-amber:hover{background:var(--amber-d);}
.btn-outline{background:transparent;border-color:var(--bdr);color:var(--txt);}
.btn-outline:hover{border-color:var(--amber);color:var(--amber);}
.btn-red{background:transparent;border-color:var(--red);color:var(--red);}
.btn-red:hover{background:var(--red);color:#fff;}
.btn-green{background:transparent;border-color:var(--green);color:var(--green);}
.btn-green:hover{background:var(--green);color:#151515;}
.btn-sm{padding:5px 12px;font-size:10.5px;}
.btn-icon{width:32px;height:32px;padding:0;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;}
.card:hover{box-shadow:var(--card-hover);transform:translateY(-2px);}
.card-body{padding:16px;}
.stat-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:20px;}
.stat-num{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;line-height:1;margin-bottom:3px;}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat-sub{font-size:10.5px;color:var(--muted);margin-top:5px;}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.badge-active{background:rgba(62,207,142,.12);color:var(--green);}
.badge-warning{background:rgba(240,136,62,.12);color:var(--orange);}
.badge-danger{background:rgba(232,72,58,.12);color:var(--red);}
.badge-info{background:rgba(62,160,232,.12);color:var(--blue);}
.badge-amber{background:var(--amber-light);color:var(--amber);}
.badge-purple{background:rgba(139,109,232,.12);color:var(--purple);}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bdr);background:var(--sur);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;transition:all var(--trans);}
.chip:hover{border-color:var(--amber);color:var(--txt);}
.chip.active{background:var(--amber);color:#151515;border-color:var(--amber);}
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead tr{background:var(--sur2);border-bottom:1px solid var(--bdr);}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--sur2);}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#151515;flex:none;}
.emp-name{font-weight:600;font-size:13px;}
.emp-id{font-size:10px;color:var(--muted);}
.form-section{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:14px;}
.form-section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-label-sm{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.form-control-sm{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-size:12.5px;}
.form-control-sm:focus{border-color:var(--amber);}
select.form-control-sm{background:var(--sur2);}
.search-bar{width:100%;padding:9px 14px 9px 38px;border-radius:99px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-size:13px;}
.search-wrap{position:relative;flex:1;max-width:360px;}
.search-wrap .mat-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .mat-ico{font-size:52px;display:block;margin-bottom:12px;opacity:.3;}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--txt2);}
.empty-state p{font-size:12.5px;}
.pagination{display:flex;align-items:center;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr);}
.page-info{font-size:12px;color:var(--muted);flex:1;}
.page-btns{display:flex;gap:4px;margin-left:auto;}
.page-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--bdr);background:var(--sur2);color:var(--txt);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--trans);}
.page-btn:hover,.page-btn.active{background:var(--amber);color:#151515;border-color:var(--amber);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(5,6,8,.75);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--sur);border:1px solid var(--bdr);border-radius:18px;width:100%;max-width:800px;transform:translateY(30px) scale(.97);transition:transform .3s;box-shadow:var(--shadow);margin:auto 0;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-accent{height:4px;background:var(--stripe);background-size:24px 24px;border-radius:18px 18px 0 0;}
.modal-head{padding:16px 18px 12px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--bdr);}
.modal-head h2{font-size:18px;text-transform:uppercase;flex:1;}
.modal-ico{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;}
.close-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--bdr);background:var(--sur2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all var(--trans);flex:none;}
.close-btn:hover{background:var(--red);color:#fff;border-color:var(--red);}
.modal-body{padding:14px 18px 18px;}
.modal-foot{padding:4px 18px 18px;display:flex;gap:8px;flex-wrap:wrap;}
/* TOAST */
.toast-box{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:10px 16px;border-radius:10px;background:var(--sur);border:1px solid var(--bdr);box-shadow:var(--shadow);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;animation:tIn .3s ease;pointer-events:auto;max-width:320px;}
.toast.out{animation:tOut .3s ease forwards;}
@keyframes tIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes tOut{to{opacity:0;transform:translateY(20px);}}
/* DASHBOARD */
.dash-greeting{margin-bottom:20px;}
.dash-greeting h2{font-size:24px;font-weight:700;text-transform:uppercase;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.chart-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;}
.chart-card-title{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.chart-card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.quick-action{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;transition:all var(--trans);position:relative;overflow:hidden;}
.quick-action::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.quick-action:nth-child(1)::before{background:var(--amber);}
.quick-action:nth-child(2)::before{background:var(--green);}
.quick-action:nth-child(3)::before{background:var(--orange);}
.quick-action:nth-child(4)::before{background:var(--purple);}
.quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--amber);}
.qa-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.qa-title{font-size:12px;font-weight:700;text-transform:uppercase;}
.qa-desc{font-size:10.5px;color:var(--muted);line-height:1.35;}
.activity-list{display:flex;flex-direction:column;gap:6px;}
.activity-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);background:var(--sur2);border:1px solid var(--bdr);}
.activity-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;}
.activity-info{flex:1;min-width:0;}
.activity-title{font-size:12.5px;font-weight:600;}
.activity-time{font-size:10.5px;color:var(--muted);}
/* TRAINING */
.training-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.training-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all var(--trans);}
.training-card:hover{transform:translateY(-3px);box-shadow:var(--card-hover);}
.training-thumb{height:110px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.training-thumb .overlay-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.6) 100%);}
.training-thumb .category-chip{position:absolute;top:8px;left:8px;z-index:2;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(3px);}
.training-body{padding:12px;}
.training-title{font-size:14px;font-weight:700;text-transform:uppercase;margin-bottom:4px;}
.training-meta{font-size:10.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.training-meta span{display:flex;align-items:center;gap:3px;}
.training-progress{height:4px;border-radius:2px;background:var(--sur3);overflow:hidden;margin-bottom:8px;}
.training-progress .fill{height:100%;border-radius:2px;background:var(--green);transition:width .6s ease;}
/* EQUIPMENT */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.eq-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all var(--trans);}
.eq-card:hover{transform:translateY(-3px);box-shadow:var(--card-hover);}
.eq-thumb{height:90px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;}
.eq-thumb .eq-tag{position:absolute;top:6px;left:6px;font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(3px);text-transform:uppercase;}
.eq-body{padding:10px 12px;}
.eq-name{font-size:13.5px;font-weight:700;text-transform:uppercase;margin-bottom:2px;}
.eq-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.eq-spec{font-size:10.5px;font-family:'JetBrains Mono',monospace;background:var(--sur2);border:1px solid var(--bdr);border-radius:5px;padding:4px 6px;margin:6px 0;line-height:1.4;}
.eq-actions{display:flex;gap:5px;margin-top:6px;}
.eq-actions .btn{flex:1;padding:6px 8px;font-size:9.5px;}
/* VIDEO LIBRARY */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.video-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all var(--trans);}
.video-card:hover{transform:translateY(-3px);box-shadow:var(--card-hover);}
.video-thumb{height:160px;background:var(--sur3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.video-play{width:50px;height:50px;border-radius:50%;background:rgba(255,176,32,.9);display:flex;align-items:center;justify-content:center;z-index:2;}
.video-play .mat-ico{font-size:24px;color:#151515;}
.video-body{padding:12px;}
.video-title{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.video-meta{font-size:11px;color:var(--muted);display:flex;gap:10px;}
/* QUIZ */
.quiz-wrap{max-width:760px;margin:0 auto;}
.quiz-header{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;}
.quiz-ico{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.quiz-title{font-size:20px;text-transform:uppercase;font-weight:700;flex:1;}
.timer-display{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;}
.timer-display.urgent{color:var(--red);animation:pls 1s ease infinite;}
@keyframes pls{0%,100%{opacity:1;}50%{opacity:.4;}}
.progress-bar-wrap{height:6px;border-radius:3px;background:var(--sur3);overflow:hidden;margin-bottom:16px;}
.progress-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .3s;}
.question-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:12px;}
.question-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:6px;}
.question-text{font-size:15px;font-weight:600;line-height:1.45;margin-bottom:14px;}
.options{display:flex;flex-direction:column;gap:8px;}
.option{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--bdr);background:var(--sur2);cursor:pointer;transition:all var(--trans);}
.option:hover{border-color:var(--amber);background:var(--amber-light);}
.option.selected{border-color:var(--amber);background:var(--amber-light);}
.option.correct{border-color:var(--green);background:rgba(62,207,142,.1);}
.option.wrong{border-color:var(--red);background:rgba(232,72,58,.1);}
.option-letter{width:26px;height:26px;border-radius:50%;background:var(--sur3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.quiz-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.q-nav-btns{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.q-nav-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--bdr);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--trans);}
.q-nav-btn.answered{background:var(--amber);color:#151515;border-color:var(--amber);}
.q-nav-btn.current{border-color:var(--blue);color:var(--blue);}
.result-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:28px;text-align:center;margin-bottom:16px;}
.result-score{font-family:'Oswald',sans-serif;font-size:72px;font-weight:700;line-height:1;}
.result-label{font-size:20px;font-weight:700;text-transform:uppercase;margin-top:6px;}
.result-pass{color:var(--green);}
.result-fail{color:var(--red);}
/* SOP */
.sop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.sop-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;transition:all var(--trans);}
.sop-card:hover{border-color:var(--amber);box-shadow:var(--card-hover);}
.sop-title{font-size:13.5px;font-weight:700;text-transform:uppercase;}
/* REPORTS */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px;}
.report-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all var(--trans);}
.report-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--card-hover);}
/* SETTINGS */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
/* CERT BANNER */
.cert-banner{background:linear-gradient(135deg,rgba(255,176,32,.12),rgba(139,109,232,.12));border:1px solid rgba(255,176,32,.3);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:14px;}
/* VIDEO MODAL EMBED */
.video-embed-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--r-sm);}
.video-embed-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--r-sm);}
/* RESPONSIVE */
@media(max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .quick-actions{grid-template-columns:repeat(2,1fr);}
  .settings-grid{grid-template-columns:1fr;}
}
@media(max-width:640px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  .main-area{margin-left:0;}
  .menu-toggle{display:flex!important;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .quick-actions{grid-template-columns:1fr 1fr;}
  .topbar-search input{width:140px;}
}
</style>
</head>
<body>
<div class="gradient-bar"></div>
<div class="bg-layer bg-dots"></div>
<div class="bg-layer bg-glow"></div>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-bg"></div>
  <div class="login-dots"></div>
  <div class="login-safety-bar"></div>
  <div class="login-safety-icons"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">🛡️</div>
        <h1>PTS SAFETY</h1>
        <p>Training Management System</p>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:16px;" id="loginDateTime"></div>
      <div class="login-tabs">
        <button class="login-tab active" id="tabAdmin" onclick="setLoginType('admin')">Admin Login</button>
        <button class="login-tab" id="tabEmp" onclick="setLoginType('employee')">Employee Login</button>
      </div>
      <div class="form-group">
        <label class="form-label" id="loginIdLabel">Username</label>
        <div class="input-icon-wrap">
          <span class="mat-ico">person</span>
          <input type="text" class="form-control" id="loginId" placeholder="Enter admin username" autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>

          <span class="mat-ico">lock</span>
          <input type="password" class="form-control" id="loginPw" placeholder="Enter password" autocomplete="off">
          <span class="mat-ico pw-toggle" id="pwToggle" onclick="togglePw()">visibility</span>
        </div>
      </div>
      <div class="checkbox-row">
        <label class="checkbox-label"><input type="checkbox" id="rememberMe"> Remember me</label>
        <button class="link-btn" onclick="showForgot()">Forgot password?</button>
      </div>
      <button class="btn-primary-full" id="loginBtn" onclick="doLogin()">PTS SAFETY SIGN IN</button>

    </div>
    <div class="login-footer">PTS SAFETY — Training Management System</div>

  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>
<aside id="sidebar">
  <div class="sidebar-head">
    <div class="brand-mark">⚠️</div>
    <div class="brand-text"><h2>PTS SAFETY</h2><span>Training System</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="nav-section-title">Main Menu</div>
    <button class="nav-item active" data-view="dashboard" onclick="gotoView('dashboard')"><span class="mat-ico">dashboard</span><span>Dashboard</span></button>
    <button class="nav-item" data-view="employees" onclick="gotoView('employees')"><span class="mat-ico">people</span><span>Employees</span><span class="nav-badge" id="nb-employees">0</span></button>
    <button class="nav-item" data-view="trainings" onclick="gotoView('trainings')"><span class="mat-ico">school</span><span>Trainings</span><span class="nav-badge" id="nb-trainings">0</span></button>
    <button class="nav-item" data-view="equipment" onclick="gotoView('equipment')"><span class="mat-ico">build</span><span>Equipment Library</span><span class="nav-badge" id="nb-equipment">0</span></button>
    <div class="nav-section-title">Resources</div>
    <button class="nav-item" data-view="videos" onclick="gotoView('videos')"><span class="mat-ico">play_circle</span><span>Video Library</span></button>
    <button class="nav-item" data-view="sop" onclick="gotoView('sop')"><span class="mat-ico">description</span><span>SOP Library</span></button>
    <button class="nav-item" data-view="quiz" onclick="gotoView('quiz')"><span class="mat-ico">quiz</span><span>Online Tests</span></button>
    <button class="nav-item" data-view="certificates" onclick="gotoView('certificates')"><span class="mat-ico">workspace_premium</span><span>Certificates</span></button>
    <div class="nav-section-title">Analytics</div>
    <div id="reportsNav">
      <button class="nav-item" data-view="reports" onclick="gotoView('reports')"><span class="mat-ico">bar_chart</span><span>Reports</span></button>
      <button class="nav-item" data-view="trainstatus" onclick="gotoView('trainstatus')"><span class="mat-ico">fact_check</span><span>Training Status</span></button>
    </div>
    <button class="nav-item" data-view="notifications" onclick="gotoView('notifications')"><span class="mat-ico">notifications</span><span>Notifications</span><span class="nav-badge" id="nb-notif" style="background:rgba(232,72,58,.2);color:var(--red)">3</span></button>
    <div id="adminNav">
      <div class="nav-section-title">Admin</div>
      <button class="nav-item" data-view="settings" onclick="gotoView('settings')"><span class="mat-ico">settings</span><span>Settings</span></button>
    </div>
  </nav>
  <div class="sidebar-foot">
    <div class="user-card" onclick="gotoView('settings')">
      <div class="user-avatar" id="sidebarAvatar">A</div>
      <div style="flex:1;min-width:0;">
        <div class="user-name" id="sidebarName">Admin</div>
        <div class="user-role" id="sidebarRole">Administrator</div>
      </div>
    </div>
    <div class="foot-actions">
      <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()"><span class="mat-ico">dark_mode</span></button>
      <button class="icon-btn" title="Logout" onclick="doLogout()"><span class="mat-ico">logout</span></button>
      <!-- version removed -->
    </div>
  </div>
</aside>

<!-- MAIN AREA -->
<div class="main-area" id="mainArea" style="display:none;">
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()"><span class="mat-ico">menu</span></button>
    <div class="page-title" id="pageTitle">Dashboard</div>
    <div class="topbar-gap"></div>
    <div class="topbar-search">
      <span class="mat-ico">search</span>
      <input type="text" id="globalSearch" placeholder="Search everything..." oninput="onGlobalSearch(this.value)">
    </div>
    <div class="topbar-actions">
      <div id="syncIndicator" style="display:flex;align-items:center;gap:4px;font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--bdr);background:var(--sur2);cursor:pointer;transition:all .3s;" onclick="forceSyncToCloud()" title="Click to force sync to cloud">
        <span class="mat-ico" id="syncIcon" style="font-size:15px;color:var(--green);">cloud_done</span>
        <span id="syncText" style="color:var(--muted);font-weight:600;">Synced</span>
      </div>
      <div class="notif-btn" onclick="toggleNotifPanel()">
        <span class="mat-ico" style="font-size:18px;">notifications</span>
        <div class="notif-dot" id="notifDot"></div>
      </div>
      <span class="role-chip" id="roleBadge">Admin</span>
    </div>
  </header>
  <div class="content" id="mainContent">
    <div class="view active" id="view-dashboard"></div>
    <div class="view" id="view-employees"></div>
    <div class="view" id="view-trainings"></div>
    <div class="view" id="view-equipment"></div>
    <div class="view" id="view-videos"></div>
    <div class="view" id="view-sop"></div>
    <div class="view" id="view-quiz"></div>
    <div class="view" id="view-certificates"></div>
    <div class="view" id="view-reports"></div>
    <div class="view" id="view-trainstatus"></div>
    <div class="view" id="view-notifications"></div>
    <div class="view" id="view-settings"></div>
  </div>
</div>

<!-- Notification Panel -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-head">
    <strong style="font-size:13px;">Notifications</strong>
    <button class="btn btn-sm btn-outline" onclick="markAllRead()">Mark all read</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>

<!-- Toast -->
<div class="toast-box" id="toastBox"></div>

<script>
/* ============================================================
   CATEGORIES
============================================================ */
const CATEGORIES={
  "Fire Fighting":{color:"#e8483a",icon:"🧯"},
  "Fire Detection & Alarm":{color:"#ff7a3d",icon:"🔍"},
  "Electrical Systems":{color:"#f4c542",icon:"⚡"},

function resolveQuizCategory(cat){
  if(QUESTION_BANK[cat]&&QUESTION_BANK[cat].length)return cat;
  const mapped=EQUIP_TO_TRAINING_CAT[cat];
  if(mapped&&QUESTION_BANK[mapped]&&QUESTION_BANK[mapped].length)return mapped;
  // fuzzy match
  const keys=Object.keys(QUESTION_BANK);
  const catLower=cat.toLowerCase();
  for(const k of keys){if(catLower.includes(k.toLowerCase().split(' ')[0])||k.toLowerCase().includes(catLower.split(' ')[0]))return k;}
  // auto-generate for this category if not exists
  if(!QUESTION_BANK[cat]){
    QUESTION_BANK[cat]=generateCategoryQuestions(cat);
  }
  return cat;
}

async function fbSaveCollection(collName,items,keyField){
  if(!firebaseReady)return;
  try{
    const batch=fbDB.batch();
    const chunkSize=400;
    let saved=0;
    for(let i=0;i<items.length;i+=chunkSize){
      const chunk=items.slice(i,i+chunkSize);
      for(const item of chunk){
        const docId=item[keyField]||item.id||item.username||item.num;
        if(!docId)continue;
        const ref=fbDB.collection(collName).doc(String(docId));
        const data={...item};
        batch.set(ref,data,{merge:true});
        saved++;
      }
      await batch.commit();
    }
    console.log('Firebase saved: '+collName+' ('+saved+' docs)');
  }catch(e){
    console.warn('fbSaveCollection error ('+collName+'):',e);
  }
}

  if(!firebaseReady)return;
  try{await fbDB.collection('config').doc('settings').set(DB.settings,{merge:true});}catch(e){console.warn('fbSaveSettings error:',e);}
}

// Auto-sync: Admin pushes every 60s, Employees pull every 30s
function startAutoSync(){
  if(!firebaseReady)return;
  const interval=isAdmin?60000:30000;
  setInterval(async function(){
    if(!currentUser||document.hidden)return;
    try{
      if(isAdmin){
        // Admin: push current data to cloud
        await Promise.all([
          fbSaveCollection('employees',DB.employees,'id'),
          fbSaveCollection('trainings',DB.trainings,'id'),
          fbSaveCollection('videos',DB.videos,'id'),
          fbSaveCollection('sops',DB.sops,'id'),
          fbSaveCollection('testResults',DB.testResults,'id'),
          fbSaveCollection('certificates',DB.certificates,'num'),
          fbSaveCollection('notifications',DB.notifications,'id'),
          fbSaveCollection('customEquipment',DB.customEquipment||[],'id'),
          fbSaveCollection('customQuestions',DB.customQuestions||[],'ts'),
          fbSaveSettings()
        ]);
        _lastSyncTime=Date.now();
        updateSyncUI('idle');
      }else{
        // Employee: pull latest from cloud
        await loadDBFromFirestore();
        saveDB();
        _lastSyncTime=Date.now();
        updateSyncUI('idle');
        // Refresh current view if data changed
        if(typeof renderAll==='function')renderAll();
      }
    }catch(e){console.warn('Auto-sync error:',e);}
  },interval);
}

async function seedFirestore(){
  if(!firebaseReady)return;
  try{
    const metaDoc=await fbDB.collection('config').doc('meta').get();
    if(metaDoc.exists)return;
    console.log('Seeding Firestore with default data...');
    await fbDB.collection('config').doc('meta').set({seeded:true,version:2});
    await fbSaveCollection('employees',DB.employees,'id');

function toast(msg,type="success",duration=3000){
  const box=document.getElementById("toastBox");
  const el=document.createElement("div");
  const icons={success:"check_circle",error:"error",warning:"warning",info:"info"};
  const colors={success:"var(--green)",error:"var(--red)",warning:"var(--amber)",info:"var(--blue)"};
  el.className="toast";

  el.innerHTML=`<span class="mat-ico" style="color:${colors[type]||colors.info}">${icons[type]||'info'}</span><span>${msg}</span>`;
  box.appendChild(el);

function formatDate(d){if(!d)return"N/A";const dt=new Date(d);return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function genId(prefix){return prefix+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();}
function avatarColor(name){const colors=["#e8483a","#ffb020","#3ecf8e","#3ea0e8","#8b6de8","#f0883e"];let h=0;for(let c of(name||"?"))h+=c.charCodeAt(0);return colors[h%colors.length];}

function daysUntil(dateStr){const now=new Date(),d=new Date(dateStr);return Math.ceil((d-now)/(1000*60*60*24));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function extractYoutubeId(url){
  if(!url)return null;
  const patterns=[/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/\s]+)/,/^([A-Za-z0-9_-]{11})$/];
  for(const p of patterns){const m=url.match(p);if(m)return m[1];}
  return null;
}

async function doLogin(){
  const id=document.getElementById("loginId").value.trim();
  const pw=document.getElementById("loginPw").value;
  if(!id||!pw){toast("Please enter credentials","error");return;}
  // Auto-detect login type based on input
  if(loginType==="admin"&&id.toUpperCase().startsWith("EMP")){setLoginType("employee");}
  if(loginType==="employee"&&(id.toLowerCase()==="admin")){setLoginType("admin");}
  document.getElementById("loginBtn").disabled=true;
  document.getElementById("loginBtn").innerHTML='<span class=\'mat-ico\' style=\'animation:spin 1s linear infinite\'>sync</span> Signing in...';
  try{
    // Try Firebase Auth first (if available and configured)
    if(firebaseReady){
      try{
        const email=toEmail(id);
        await fbAuth.signInWithEmailAndPassword(email,pw);
      }catch(fbErr){
        console.warn('Firebase Auth failed, using local DB fallback:',fbErr.code);
        // Fall through to local DB check below
      }
    }
    // Always verify against local DB (source of truth)
    if(loginType==="admin"){
      const admin=DB.admins.find(a=>a.username===id);
      if(!admin){toast("Invalid admin credentials","error");return;}
      if(admin.password!==pw){toast("Invalid admin credentials","error");return;}
      currentUser={...admin,type:"admin"};isAdmin=true;
    }else{
      const emp=DB.employees.find(e=>e.id===id);
      if(!emp){toast("Invalid Employee ID or password","error");return;}
      if(emp.password!==pw){toast("Invalid Employee ID or password","error");return;}
      currentUser={...emp,type:"employee"};isAdmin=false;
    }
    // If Firebase is ready but auth failed above (wrong pw in Firebase), update it
    if(firebaseReady&&fbAuth.currentUser){
      // Already signed in via Firebase Auth - good
    }else if(firebaseReady){
      // Firebase Auth didn't work but local DB verified - create/update Firebase account silently
      const email=toEmail(id);
      try{
        await fbAuth.signInWithEmailAndPassword(email,pw);
      }catch(signInErr){
        try{
          await fbAuth.createUserWithEmailAndPassword(email,pw);
        }catch(createErr){
          if(createErr.code!=='auth/email-already-in-use')console.warn('Firebase account sync error:',createErr.message);
        }
      }
    }
    const safeUser={...currentUser};delete safeUser.password;
    if(document.getElementById("rememberMe").checked)localStorage.setItem("mep_user",JSON.stringify(safeUser));
    startApp();
  }catch(e){
    toast("Login failed. Please try again.","error");
  }finally{
    const btn=document.getElementById("loginBtn");
    if(btn){btn.disabled=false;btn.textContent='PTS SAFETY SIGN IN';}
  }
}

function onGlobalSearch(q){
  if(!q)return;
  const ql=q.toLowerCase();
  const eqs=EQUIPMENT_DATA.filter(e=>e.n.toLowerCase().includes(ql)||e.c.toLowerCase().includes(ql));
  const emps=DB.employees.filter(e=>e.name.toLowerCase().includes(ql)||e.id.toLowerCase().includes(ql));
  const trns=DB.trainings.filter(t=>t.name.toLowerCase().includes(ql)||t.cat.toLowerCase().includes(ql));
  const vids=DB.videos.filter(v=>v.title.toLowerCase().includes(ql)||v.cat.toLowerCase().includes(ql));
  if(eqs.length){equip_filter="All";equip_search=q;gotoView("equipment");}
  else if(emps.length){emp_search=q;gotoView("employees");}
  else if(trns.length){trn_search=q;gotoView("trainings");}
  else if(vids.length){vid_search=q;gotoView("videos");}
  else toast("No results found for: "+q,"info");
}

  if(firebaseReady){

    fbAuth.signInWithEmailAndPassword(empEmail,empPw)
      .then(()=>console.log('Auth account exists for',id))

          .catch(e=>{if(e.code!=='auth/email-already-in-use')console.warn('Auth create error for',id,e.message);});

async function deleteEmp(id){
  if(!confirm("Delete this employee PERMANENTLY? All their training records, test results, certificates, and Firebase data will be erased. This cannot be undone."))return;
  // 1. Remove from local employees list
  DB.employees=DB.employees.filter(e=>e.id!==id);
  // 2. Remove employee from all training enrolled/completed lists
  DB.trainings.forEach(t=>{
    if(t.enrolled) t.enrolled=t.enrolled.filter(eid=>eid!==id);
    if(t.completed) t.completed=t.completed.filter(eid=>eid!==id);
    if(t.completedDates) delete t.completedDates[id];
  });
  // 3. Remove all test results for this employee (local)
  DB.testResults=DB.testResults.filter(r=>r.empId!==id);
  // 4. Remove all certificates for this employee (local)
  DB.certificates=DB.certificates.filter(c=>c.empId!==id);
  // 5. Remove from video completedBy lists
  DB.videos.forEach(v=>{
    if(v.completedBy) v.completedBy=v.completedBy.filter(eid=>eid!==id);
  });
  // 6. Remove any notifications related to this employee
  DB.notifications=DB.notifications.filter(n=>!n.msg||!n.msg.includes(id));
  // 7. PERMANENTLY delete from Firebase Firestore (not just local)
  if(firebaseReady){
    try{
      const batch=fbDB.batch();
      // Delete employee doc
      batch.delete(fbDB.collection('employees').doc(String(id)));
      // Delete their test result docs from Firestore
      const testSnap=await fbDB.collection('testResults').where('empId','==',id).get();
      testSnap.forEach(d=>batch.delete(d.ref));
      // Delete their certificate docs from Firestore
      const certSnap=await fbDB.collection('certificates').where('empId','==',id).get();
      certSnap.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      console.log('Firebase: permanently deleted employee '+id+' and all linked docs');
    }catch(e){console.warn('Firebase delete error:',e);}
  }
  // 8. Save updated local data + re-render everything
  renderEmployees();renderTrainings();renderCertificates();renderQuizMenu();updateBadges();saveDB();
  toast("Employee PERMANENTLY deleted from all records and cloud","warning");
}

let customQCount=0;
function addCustomQuestion(){
  const n=customQCount++;
  const container=document.getElementById('customQuestionsList');
  const div=document.createElement('div');
  div.id='cq_'+n;
  div.style.cssText='background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r-sm);padding:10px;margin-bottom:8px;';
  div.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:11px;font-weight:700;color:var(--txt);">Question ${n+1}</span>
      <button class="btn btn-sm" style="padding:2px 8px;border:1px solid var(--red);color:var(--red);background:rgba(232,72,58,.08);font-size:10px;" onclick="document.getElementById('cq_${n}').remove()"><span class="mat-ico" style="font-size:11px;">close</span></button>
    </div>
    <input class="form-control-sm" id="cq_q_${n}" placeholder="Enter question text..." style="width:100%;margin-bottom:6px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <input class="form-control-sm cq_opt" id="cq_o0_${n}" placeholder="Option A">
      <input class="form-control-sm cq_opt" id="cq_o1_${n}" placeholder="Option B">
      <input class="form-control-sm cq_opt" id="cq_o2_${n}" placeholder="Option C">
      <input class="form-control-sm cq_opt" id="cq_o3_${n}" placeholder="Option D">
    </div>
    <div style="margin-top:6px;font-size:10px;color:var(--muted);">Correct Answer: <select id="cq_a_${n}"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>
  `;
  container.appendChild(div);
}
function getCustomQuestions(){
  const qs=[];
  for(let i=0;i<customQCount;i++){
    const el=document.getElementById('cq_'+i);
    if(!el)continue;
    const q=document.getElementById('cq_q_'+i)?.value.trim();
    const o0=document.getElementById('cq_o0_'+i)?.value.trim();
    const o1=document.getElementById('cq_o1_'+i)?.value.trim();
    const o2=document.getElementById('cq_o2_'+i)?.value.trim();
    const o3=document.getElementById('cq_o3_'+i)?.value.trim();
    const a=parseInt(document.getElementById('cq_a_'+i)?.value||'0');
    if(q&&o0&&o1){
      const opts=[o0,o1,o2||"N/A",o3||"N/A"].filter(x=>x);
      qs.push({q,o:opts,a:Math.min(a,opts.length-1)});
    }
  }
  return qs;
}
function saveTraining(){
  const name=document.getElementById("nt_name").value.trim();
  if(!name){toast("Training name required","error");return;}
  const cat=document.getElementById("nt_cat").value;
  const customQs=getCustomQuestions();
  if(customQs.length){
    if(!QUESTION_BANK[cat])QUESTION_BANK[cat]=[];
    customQs.forEach(cq=>{cq.customFor=name;QUESTION_BANK[cat].push(cq);});
    customQs.forEach(cq=>{
      DB.customQuestions.push({cat:cat,trainingName:name,q:cq.q,o:cq.o,a:cq.a,customFor:name,ts:Date.now()});
    });
    toast(`${customQs.length} custom question(s) added to ${cat} question bank`,'info');
  }
  const linkedVideoId=document.getElementById("nt_video").value;
  const linkedVideo=linkedVideoId?DB.videos.find(v=>v.id===linkedVideoId):null;
  const t={id:document.getElementById("nt_id").value,name,cat,dept:document.getElementById("nt_dept").value,trainer:document.getElementById("nt_trainer").value,date:document.getElementById("nt_date").value,duration:linkedVideo?linkedVideo.duration:(document.getElementById("nt_dur").value||"4 hrs"),passing:parseInt(document.getElementById("nt_pass").value)||75,validity:document.getElementById("nt_val").value||"1 Year",cert:document.getElementById("nt_cert").value==="true",desc:document.getElementById("nt_desc").value,enrolled:[],completed:[],completedDates:{},customQuestions:customQs.length};
  if(linkedVideoId){t.fromVideo=linkedVideoId;t.videoTitle=linkedVideo?t.videoTitle||linkedVideo.title:"";t.trainer="Video Training";}
  // Don't create duplicate video-linked training
  if(linkedVideoId&&DB.trainings.find(x=>x.fromVideo===linkedVideoId)){toast("A training already exists for this video. Use that one instead.","error");return;}
  DB.trainings.push(t);
  closeModal();renderTrainings();updateBadges();saveDB();toast(`Training "${name}" created`,"success");
}

/* ============================================================
   VIDEO PROGRESS TRACKER (YouTube IFrame API)
============================================================ */
let videoTracker={player:null,videoId:"",totalWatched:0,lastTime:0,interval:null,ready:false,percent:0,duration:0};
function onYouTubeIframeAPIReady(){console.log("YouTube IFrame API ready");}
function initVideoTracker(ytVideoId,progressBarId,pctId,timeId,completeBtnId,lockMsgId){
  destroyVideoTracker();
  videoTracker.videoId=ytVideoId;videoTracker.totalWatched=0;videoTracker.lastTime=0;videoTracker.percent=0;videoTracker.ready=false;videoTracker.duration=0;
  const container=document.getElementById(progressBarId);
  if(!container)return;
  container.innerHTML="<div id=\"ytPlayerDiv\"></div>";
  videoTracker.player=new YT.Player("ytPlayerDiv",{
    width:"100%",height:"100%",videoId:ytVideoId,
    playerVars:{autoplay:1,rel:0,modestbranding:1},
    events:{
      onReady:function(e){
        videoTracker.ready=true;
        videoTracker.duration=videoTracker.player.getDuration()||0;
        videoTracker.interval=setInterval(function(){
          if(!videoTracker.player||!videoTracker.player.getCurrentTime)return;
          try{
            const cur=videoTracker.player.getCurrentTime();
            const dur=videoTracker.player.getDuration()||videoTracker.duration;
            if(dur>0&&cur>videoTracker.lastTime){
              const delta=cur-videoTracker.lastTime;
              const capped=Math.min(delta,2);
              videoTracker.totalWatched+=capped;
            }
            videoTracker.lastTime=cur;
            videoTracker.percent=Math.min(100,Math.round(videoTracker.totalWatched/dur*100));
            const pb=document.getElementById(progressBarId+"_bar");
            const pt=document.getElementById(pctId);
            const tt=document.getElementById(timeId);
            const cb=document.getElementById(completeBtnId);
            const lm=document.getElementById(lockMsgId);
            if(pb)pb.style.width=videoTracker.percent+"%";
            if(pt)pt.textContent=videoTracker.percent+"%";
            if(tt){const cm=Math.floor(cur/60);const cs=Math.floor(cur%60);tt.textContent=cm+":"+String(cs).padStart(2,"0");}
            if(cb){
              if(videoTracker.percent>=90){cb.disabled=false;cb.style.opacity="1";cb.style.cursor="pointer";cb.classList.add("pulse-glow");}
            }
            if(lm&&videoTracker.percent>=90){lm.style.display="none";}
            if(videoTracker.percent>=100&&videoTracker.interval){
              clearInterval(videoTracker.interval);
              videoTracker.interval=null;
              if(cb&&!cb._autoClicked){cb._autoClicked=true;cb.click();}
            }
          }catch(ex){}
        },1000);
      },
      onStateChange:function(e){
        if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED){
          try{
            const cur=videoTracker.player.getCurrentTime();
            if(cur>videoTracker.lastTime){
              const dur=videoTracker.player.getDuration()||videoTracker.duration;
              if(dur>0){
                const delta=Math.min(cur-videoTracker.lastTime,2);
                videoTracker.totalWatched+=delta;
                videoTracker.percent=Math.min(100,Math.round(videoTracker.totalWatched/dur*100));
              }
            }
            videoTracker.lastTime=cur;
          }catch(ex){}
        }
      },
      onError:function(e){console.warn("YT Player error:",e.data);}
    }
  });
}

function completeVideoAndCreateTraining(videoId){
  const v=DB.videos.find(x=>x.id===videoId);
  if(!v)return;
  const empId=currentUser?currentUser.id:null;
  const today=new Date().toISOString().split("T")[0];
  // Find or create training linked to this video
  let trn=DB.trainings.find(t=>t.fromVideo===videoId);
  if(!trn){
    const trnName="Video: "+v.title;
    trn={id:genId("TRN"),name:trnName,cat:v.cat,dept:"All",trainer:"Video Training",date:today,duration:v.duration||"--",passing:75,validity:"1 Year",cert:true,desc:"Auto-created from video library: "+v.title,enrolled:[],completed:[],completedDates:{},fromVideo:videoId,videoTitle:v.title};
    DB.trainings.push(trn);
    toast("Training auto-created: "+trnName,"success");
  }
  // Mark VIDEO as watched — do NOT mark training as completed (that requires passing the test)
  if(empId){
    if(!v.completedBy)v.completedBy=[];
    if(!v.completedBy.includes(empId)){
      v.completedBy.push(empId);
    }
    // Auto-enroll employee into the training if not already
    if(!trn.enrolled)trn.enrolled=[];
    if(!trn.enrolled.includes(empId)){
      trn.enrolled.push(empId);
    }
  }
  destroyVideoTracker();
  closeModal();
  saveDB();
  updateBadges();
  if(empId){
    toast("Video watched successfully! Now take the test to complete training.","success",4000);
    // Auto-navigate to take the test for this training
    setTimeout(function(){
      startQuiz(trn.cat, trn.name);
    }, 1500);
  }
  renderVideos();
  if(!isAdmin)renderEmpTrainings();
}

function destroyVideoTracker(){
  if(videoTracker.interval){clearInterval(videoTracker.interval);videoTracker.interval=null;}
  if(videoTracker.player&&videoTracker.player.destroy){try{videoTracker.player.destroy();}catch(e){}}
  videoTracker.player=null;videoTracker.ready=false;
}

function likeVideo(id){
  if(!currentUser){toast("Login required","error");return;}
  const v=DB.videos.find(x=>x.id===id);if(!v)return;
  if(!v.likes)v.likes=[];
  const idx=v.likes.indexOf(currentUser.id);
  if(idx>=0){v.likes.splice(idx,1);toast("Removed like","info",1500);}
  else{v.likes.push(currentUser.id);toast("❤ Liked!","success",1500);}
  saveDB();
  renderVideos();
}

function previewVideoId(val){const ytId=extractYoutubeId(val);const wrap=document.getElementById("videoPreviewWrap");const frame=document.getElementById("videoPreviewFrame");if(ytId&&wrap&&frame){wrap.style.display="block";frame.src=`https://www.youtube.com/embed/${ytId}?rel=0`;}else if(wrap){wrap.style.display="none";}}
function saveVideo(){
  const title=document.getElementById("nv_title").value.trim();
  const urlVal=document.getElementById("nv_url").value.trim();
  if(!title||!urlVal){toast("Title and URL required","error");return;}
  const ytId=extractYoutubeId(urlVal);
  const fullUrl=ytId?`https://www.youtube.com/watch?v=${ytId}`:urlVal;
  const vidId=genId("VID");
  const cat=document.getElementById("nv_cat").value;
  const dur=document.getElementById("nv_dur").value||"--";
  const today=new Date().toISOString().split("T")[0];
  DB.videos.push({id:vidId,title,cat,type:"youtube",url:fullUrl,youtubeId:ytId||"",duration:dur,views:0,likes:[],added:today,completedBy:[]});
  // Auto-create a training linked to this video
  const trnName="Video: "+title;
  const trn={id:genId("TRN"),name:trnName,cat,dept:"All",trainer:"Video Training",date:today,duration:dur,passing:75,validity:"1 Year",cert:true,desc:"Auto-created from video library: "+title,enrolled:[],completed:[],completedDates:{},fromVideo:vidId,videoTitle:title};
  DB.trainings.push(trn);
  closeModal();renderVideos();renderTrainings();updateBadges();saveDB();toast("Video added & Training auto-created: "+trnName,"success");
}
function deleteVideo(id){if(!confirm("Delete this video and its linked training?"))return;DB.videos=DB.videos.filter(v=>v.id!==id);DB.trainings=DB.trainings.filter(t=>t.fromVideo!==id);renderVideos();renderTrainings();updateBadges();saveDB();toast("Video and linked training deleted","warning");}

function renderQuizMenu(){
  const cats=TRAINING_CATS;
  document.getElementById("view-quiz").innerHTML=`
    <div class="section-header"><div class="section-title">Online <span>Tests</span></div></div>
    <div style="background:var(--amber-light);border:1px solid rgba(255,176,32,.3);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:16px;font-size:12.5px;display:flex;align-items:center;gap:10px;">
      <span class="mat-ico" style="color:var(--amber);font-size:20px;">info</span>
      <div><b>Certificate Policy:</b> Score ≥ ${DB.settings.minCertScore||70}% earns a certificate. Questions are randomized every attempt.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">
      ${cats.map(cat=>{
        const catInfo=CATEGORIES[cat]||null;
        const myPassed=isAdmin?0:DB.testResults.filter(r=>r.empId===currentUser?.id&&r.training?.includes(cat)&&r.pass).length;
        const resolvedCat=resolveQuizCategory(cat);
        const qCount=(QUESTION_BANK[resolvedCat]||[]).length;
        return`<div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;cursor:pointer;transition:all var(--trans);position:relative;" onclick="startQuiz('${cat}',null)" onmouseover="this.style.borderColor='${catInfo?.color||"var(--amber)"}'" onmouseout="this.style.borderColor='var(--bdr)'">
          <div style="font-size:28px;margin-bottom:8px;">${catInfo?.icon||"📋"}</div>
          <div style="font-size:12px;font-weight:700;text-transform:uppercase;">${cat}</div>
          <div style="font-size:10.5px;color:var(--muted);margin-top:3px;">${qCount} questions available</div>
          ${myPassed?`<span class="badge badge-active" style="position:absolute;top:8px;right:8px;">✓ Passed</span>`:""}
          <div style="height:2px;border-radius:2px;background:${catInfo?.color||"var(--amber)"};margin-top:10px;"></div>
        </div>`;
      }).join("")}
    </div>
  `;
}
function startQuiz(category,trainingName){
  if(!currentUser){toast("Please login first","error");return;}
  closeModal();
  document.querySelectorAll(".view").forEach(el=>el.classList.remove("active"));
  document.getElementById("view-quiz").classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.view==="quiz"));
  currentView="quiz";
  document.getElementById("pageTitle").textContent="Online Tests";
  document.getElementById("mainContent").scrollTop=0;
  category=resolveQuizCategory(category);
  let allQs=QUESTION_BANK[category]||[];
  if(!allQs.length){allQs=generateCategoryQuestions(category);QUESTION_BANK[category]=allQs;}
  if(!allQs.length){toast("No questions available for this category","error");return;}
  const shuffled=shuffle(allQs);
  const questions=shuffled.slice(0,Math.min(10,shuffled.length));
  const processedQs=questions.map(q=>{
    const opts=[...q.o];
    const correctText=opts[q.a];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    const newA=opts.indexOf(correctText);
    return{...q,o:opts,a:newA};
  });
  const trnMatch=trainingName?DB.trainings.find(t=>t.name===trainingName):null;
  const timeLimit=processedQs.length*90;
  quizState={active:true,training:trainingName||category+" Test",category,questions:processedQs,current:0,answers:new Array(processedQs.length).fill(-1),timer:null,timeLeft:timeLimit,trnMatch};
  renderQuizActive();
  quizState.timer=setInterval(()=>{
    quizState.timeLeft--;
    const td=document.getElementById("timerDisp");
    if(td){
      const m=Math.floor(quizState.timeLeft/60);
      const s=quizState.timeLeft%60;
      td.textContent=`${m}:${String(s).padStart(2,"0")}`;
      if(quizState.timeLeft<=30)td.classList.add("urgent");
    }
    if(quizState.timeLeft<=0){clearInterval(quizState.timer);submitQuiz();}
  },1000);
}
function renderQuizActive(){
  if(!quizState.active)return;
  const{questions,current,answers}=quizState;
  const q=questions[current];
  const m=Math.floor(quizState.timeLeft/60);
  const s=quizState.timeLeft%60;
  const pct=Math.round((current+1)/questions.length*100);
  document.getElementById("view-quiz").innerHTML=`
    <div class="quiz-wrap">
      <div class="quiz-header">
        <div class="quiz-ico" style="background:rgba(255,176,32,.1)"><span class="mat-ico" style="color:var(--amber);font-size:26px;">quiz</span></div>
        <div style="flex:1;">
          <div class="quiz-title">${quizState.training}</div>
          <div style="font-size:11px;color:var(--muted);">Q ${current+1} of ${questions.length}</div>
        </div>
        <div class="timer-display${quizState.timeLeft<=30?" urgent":""}" id="timerDisp">${m}:${String(s).padStart(2,"0")}</div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="question-card">
        <div class="question-num">Question ${current+1} / ${questions.length}</div>
        <div class="question-text">${q.q}</div>
        <div class="options">
          ${q.o.map((opt,i)=>`
            <div class="option${answers[current]===i?" selected":""}" onclick="selectAnswer(${i})">
              <div class="option-letter">${["A","B","C","D"][i]}</div>
              <div style="font-size:13px;">${opt}</div>
            </div>
          `).join("")}
        </div>
      </div>
      <div class="quiz-nav" style="margin-bottom:14px;">
        <div class="q-nav-btns">
          ${questions.map((q,i)=>`<button class="q-nav-btn${answers[i]>=0?" answered":""}${i===current?" current":""}" onclick="jumpToQuestion(${i})">${i+1}</button>`).join("")}
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${current>0?`<button class="btn btn-outline" onclick="prevQuestion()"><span class="mat-ico">arrow_back</span> Prev</button>`:""}
        ${current<questions.length-1?`<button class="btn btn-amber" onclick="nextQuestion()">Next <span class="mat-ico">arrow_forward</span></button>`:""}
        <button class="btn btn-green" onclick="if(confirm('Submit test now?'))submitQuiz()"><span class="mat-ico">check_circle</span> Submit Test</button>
        <button class="btn btn-red" onclick="if(confirm('Cancel quiz?')){clearInterval(quizState.timer);quizState={active:false};renderQuizMenu();}"><span class="mat-ico">cancel</span> Cancel</button>
      </div>
    </div>
  `;
}
function selectAnswer(i){if(!quizState.active)return;quizState.answers[quizState.current]=i;renderQuizActive();}
function nextQuestion(){if(quizState.current<quizState.questions.length-1){quizState.current++;renderQuizActive();}}
function prevQuestion(){if(quizState.current>0){quizState.current--;renderQuizActive();}}
function jumpToQuestion(i){quizState.current=i;renderQuizActive();}
function submitQuiz(){
  clearInterval(quizState.timer);
  const qs=quizState.questions;
  const answers=quizState.answers;
  let correct=0;
  qs.forEach((q,i)=>{if(answers[i]===q.a)correct++;});
  const total=qs.length;
  const wrong=answers.filter((a,i)=>a>=0&&a!==qs[i].a).length;
  const skipped=answers.filter(a=>a<0).length;
  const score=Math.round(correct/total*100);
  const trnMatch=quizState.trnMatch||DB.trainings.find(t=>t.name===quizState.training&&t.cat===quizState.category);
  const passing=trnMatch?.passing||70;
  const minCertScore=DB.settings.minCertScore||70;
  const pass=score>=passing;
  const qualifiesForCert=score>=minCertScore&&(trnMatch?.cert!==false);
  const empId=currentUser.id||currentUser.username||"ADMIN";
  const empName=currentUser.name||currentUser.username||"Admin";
  const dept=currentUser.dept||"Admin";
  const today=new Date().toISOString().split("T")[0];
  const certNum=qualifiesForCert&&pass?"CERT-"+Date.now().toString(36).toUpperCase():"";
  const result={id:genId("TST"),empId,empName,dept,training:quizState.training,cat:quizState.category,score,correct,wrong,total,pass,date:today,cert:certNum,attempt:DB.testResults.filter(r=>r.empId===empId&&r.training===quizState.training).length+1,trainer:trnMatch?.trainer||""};
  DB.testResults.push(result);
  if(certNum){
    const expiry=new Date();
    const validityYears=trnMatch?.validity?.includes("2")?2:trnMatch?.validity?.includes("6")?0.5:1;
    expiry.setFullYear(expiry.getFullYear()+Math.floor(validityYears));
    DB.certificates.push({num:certNum,empId,empName,training:quizState.training,score,dept,trainer:trnMatch?.trainer||"Trainer",issued:today,expiry:expiry.toISOString().split("T")[0],completedDate:today});
    DB.notifications.unshift({id:genId("N"),msg:`Certificate ${certNum} auto-generated for ${empName} — ${quizState.training} (Score: ${score}%)`,time:"Just now",read:false,icon:"workspace_premium"});
  }
  if(trnMatch){
    if(!trnMatch.completed)trnMatch.completed=[];
    if(!trnMatch.completedDates)trnMatch.completedDates={};
    if(pass&&!trnMatch.completed.includes(empId)){trnMatch.completed.push(empId);trnMatch.completedDates[empId]=today;}
  }
  updateBadges();
  saveDB();
  quizState.active=false;
  document.getElementById("view-quiz").innerHTML=`
    <div class="quiz-wrap">
      <div class="result-card">
        ${pass&&certNum?`<div style="display:flex;justify-content:center;margin-bottom:12px;"><span class="badge badge-amber" style="font-size:12px;padding:6px 14px;"><span class="mat-ico" style="font-size:14px;">workspace_premium</span> Certificate Earned!</span></div>`:""}
        <div class="result-score ${pass?"result-pass":"result-fail"}">${score}%</div>
        <div class="result-label ${pass?"result-pass":"result-fail"}">${pass?"✅ PASSED":"❌ FAILED"}</div>
        <div style="margin:12px 0;font-size:13px;color:var(--muted);">${quizState.training}</div>
        <div style="display:flex;justify-content:center;gap:24px;margin:16px 0;">
          <div style="text-align:center;"><div style="font-size:28px;font-weight:700;color:var(--green);">${correct}</div><div style="color:var(--muted);font-size:11px;">Correct</div></div>
          <div style="text-align:center;"><div style="font-size:28px;font-weight:700;color:var(--red);">${wrong}</div><div style="color:var(--muted);font-size:11px;">Wrong</div></div>
          <div style="text-align:center;"><div style="font-size:28px;font-weight:700;color:var(--muted);">${skipped}</div><div style="color:var(--muted);font-size:11px;">Skipped</div></div>
          <div style="text-align:center;"><div style="font-size:28px;font-weight:700;color:var(--muted);">${total}</div><div style="color:var(--muted);font-size:11px;">Total</div></div>
        </div>

            <div style="font-size:12.5px;font-weight:600;margin-bottom:6px;">${i+1}. ${q.q}</div>
            <div style="font-size:11.5px;color:var(--green);">✓ Correct: ${q.o[q.a]}</div>

            ${answers[i]<0?`<div style="font-size:11.5px;color:var(--muted);">— Skipped</div>`:""}

        `).join("")}

        ${pass&&certNum?`<button class="btn btn-amber" onclick="downloadCertificate('${certNum}')"><span class="mat-ico">workspace_premium</span> Download Certificate</button>`:""}

        <button class="btn btn-outline" onclick="gotoView('quiz')"><span class="mat-ico">arrow_back</span> Back to Tests</button>
      </div>
    </div>
  `;
  if(pass&&certNum)toast(`🏆 Congratulations! Passed with ${score}% — Certificate auto-generated!`,"success",5000);
  else if(pass)toast(`✅ Passed with ${score}%! Well done.`,"success",4000);

}

function downloadCertificate(certNum){
  const cert=DB.certificates.find(c=>c.num===certNum);

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const W=297,H=210;
  doc.setFillColor(13,17,23);doc.rect(0,0,W,H,"F");
  doc.setFillColor(255,176,32);doc.rect(0,0,W,5,"F");doc.rect(0,H-5,W,5,"F");
  doc.setFillColor(62,207,142);doc.rect(0,5,5,H-10,"F");doc.rect(W-5,5,5,H-10,"F");
  doc.setDrawColor(255,176,32);doc.setLineWidth(1.5);doc.rect(10,10,W-20,H-20,"S");
  doc.setFont("helvetica","bold");doc.setTextColor(255,176,32);
  doc.setFontSize(24);doc.text("MEP & SAFETY VAULT",W/2,32,{align:"center"});
  doc.setFontSize(9);doc.setTextColor(125,133,144);

  doc.setDrawColor(255,176,32);doc.setLineWidth(0.5);doc.line(40,44,W-40,44);
  doc.setFont("helvetica","bold");doc.setTextColor(230,237,243);
  doc.setFontSize(17);doc.text("CERTIFICATE OF COMPLETION",W/2,56,{align:"center"});
  doc.setFontSize(10);doc.setTextColor(125,133,144);
  doc.text("This is to certify that the following employee has successfully completed the training:",W/2,65,{align:"center"});
  doc.setFont("helvetica","bold");doc.setTextColor(255,176,32);
  doc.setFontSize(30);doc.text(cert.empName.toUpperCase(),W/2,82,{align:"center"});
  const nw=doc.getTextWidth(cert.empName.toUpperCase());
  doc.setDrawColor(255,176,32);doc.setLineWidth(0.8);doc.line(W/2-nw/2,84,W/2+nw/2,84);
  doc.setFont("helvetica","normal");doc.setTextColor(201,209,217);doc.setFontSize(11);
  doc.text(`Employee ID: ${cert.empId}   |   Department: ${cert.dept}`,W/2,94,{align:"center"});
  doc.text("has successfully completed the training program:",W/2,103,{align:"center"});
  doc.setFont("helvetica","bold");doc.setTextColor(62,207,142);doc.setFontSize(15);
  doc.text(cert.training.toUpperCase(),W/2,115,{align:"center"});
  doc.setFont("helvetica","normal");doc.setTextColor(125,133,144);doc.setFontSize(9);
  const infoY=127;
  doc.text(`Score Achieved: ${cert.score}%`,60,infoY);
  doc.text(`Completion Date: ${formatDate(cert.completedDate||cert.issued)}`,120,infoY);
  doc.text(`Issued: ${formatDate(cert.issued)}`,190,infoY);
  doc.text(`Valid Until: ${formatDate(cert.expiry)}`,240,infoY);
  doc.setDrawColor(45,51,59);doc.setLineWidth(0.5);doc.line(40,133,W-40,133);
  doc.setDrawColor(125,133,144);doc.setLineWidth(0.5);
  doc.line(45,158,105,158);doc.line(W/2-30,158,W/2+30,158);doc.line(W-105,158,W-45,158);
  doc.setFontSize(8);doc.setTextColor(125,133,144);
  doc.text("Trainer: "+cert.trainer,75,162,{align:"center"});
  doc.text("Safety Manager",W/2,162,{align:"center"});
  doc.text("Authorized Signatory",W-75,162,{align:"center"});
  doc.setFontSize(8);doc.setTextColor(100,108,116);
  doc.text(`Certificate No: ${cert.num}   ·   ${DB.settings.companyName}   ·   Printed: ${formatDate(new Date().toISOString().split("T")[0])}`,W/2,175,{align:"center"});
  doc.save(`Certificate_${cert.empId}_${cert.num}.pdf`);
  toast("Certificate downloaded successfully","success");
}
